<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wizard's Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500;1,700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#1B1445">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wizard's Ledger">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#F6EBCB;color-scheme:dark;background:linear-gradient(180deg,#070620 0%,#14104A 50%,#2A1763 100%) fixed;overflow-x:hidden}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 30% at 20% 30%,rgba(90,60,220,.38),transparent 70%),radial-gradient(35% 28% at 80% 20%,rgba(40,180,170,.22),transparent 70%),radial-gradient(45% 30% at 60% 70%,rgba(200,60,160,.18),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.stars i{position:absolute;border-radius:50%;background:#FFF3C4;animation:twinkle 3s ease-in-out infinite}
.constel{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.constel path{fill:none;stroke:rgba(242,201,76,.55);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 14s ease-in-out infinite}
.constel circle{fill:#F2C94C;animation:twinkle 3s ease-in-out infinite}
.moon{position:fixed;top:56px;right:7%;width:96px;height:96px;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle at 30% 40%,rgba(120,100,40,.16) 0 7%,transparent 8%),radial-gradient(circle at 62% 62%,rgba(120,100,40,.14) 0 10%,transparent 11%),radial-gradient(circle at 58% 24%,rgba(120,100,40,.12) 0 5%,transparent 6%),radial-gradient(circle at 35% 35%,#FFFDF0,#F3E7B8 55%,#D9CA8C);box-shadow:0 0 60px 18px rgba(255,238,170,.26),0 0 140px 40px rgba(255,238,170,.1)}
.shoot{position:fixed;top:14%;left:-20%;width:160px;height:2px;z-index:0;pointer-events:none;background:linear-gradient(90deg,transparent,#fff);opacity:0;transform:rotate(22deg);animation:shoot 16s ease-in infinite 4s}
.orb{position:fixed;bottom:-30px;border-radius:50%;z-index:1;pointer-events:none;background:radial-gradient(circle,#FFF6C0 0,rgba(255,200,80,.75) 40%,transparent 70%);animation:rise linear infinite}
.castle{position:fixed;left:0;right:0;bottom:0;width:100%;height:300px;z-index:1;pointer-events:none}
.win{animation:twinkle 4s ease-in-out infinite}
.mist{animation:mist 30s ease-in-out infinite alternate}.m2{animation-duration:38s;animation-direction:alternate-reverse}
.ground{position:fixed;left:0;bottom:0;z-index:1;pointer-events:none}
.cat{position:absolute;left:min(8vw,90px);bottom:6px;width:84px}
.tail{transform-origin:62px 60px;animation:swish 3s ease-in-out infinite alternate}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.hero{position:relative;z-index:2;max-width:1120px;margin:0 auto;height:300px;text-align:center;padding-top:112px;overflow:hidden}
.hero h1{margin:0;font-family:Cinzel,Georgia,"Palatino Linotype",serif;font-weight:700;font-size:clamp(30px,6.4vw,58px);line-height:1.1;letter-spacing:.04em;background:linear-gradient(180deg,#FFF3C4,#E5B53A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(242,201,76,.4))}
.hero p{margin:12px auto 0;max-width:520px;padding:0 70px;color:#C9C2EE;font-size:17px}
.book{position:absolute;filter:drop-shadow(0 0 10px rgba(255,220,120,.45));animation:bob 4.4s ease-in-out infinite}
.pg{transform-origin:32px 22px;animation:turn 3.4s ease-in-out infinite}
.char{position:absolute;bottom:0;height:150px;animation:bob 3.6s ease-in-out infinite}
.w1{left:3%}.w2{right:3%;animation-delay:1.2s}
.glow{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.owl-fly{position:absolute;top:14px;left:-130px;animation:fly 26s linear infinite 2s}
.owl-fly svg{animation:bob 1.1s ease-in-out infinite}
.wl{transform-origin:34px 50px;animation:flapL .45s ease-in-out infinite alternate}
.wr{transform-origin:66px 50px;animation:flapR .45s ease-in-out infinite alternate}
.owl-wrap{position:absolute;top:0;left:0;width:100%;height:340px;overflow:hidden;pointer-events:none;z-index:1}
.owl-snow{position:absolute;left:0;top:0;width:190px;height:auto;transform:translate(-400px,0);will-change:transform;filter:drop-shadow(0 0 14px rgba(190,215,255,.75)) drop-shadow(0 0 4px rgba(255,255,255,.6))}
.dust{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFF1B8;box-shadow:0 0 8px #FFD76A,0 0 14px rgba(255,215,106,.6);animation:dust 1.5s ease-out forwards}
.owl-ic{width:64px;height:auto;filter:drop-shadow(0 0 6px rgba(190,215,255,.6))}
@keyframes dust{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#app{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:22px}
.foot{position:relative;z-index:2;text-align:center;color:#C9C2EE;font-size:14px;padding:8px 20px 150px}
h2{margin:0;display:flex;align-items:center;gap:10px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:19px;color:#F2C94C}
p{margin:0}.muted{color:#C9C2EE}.row{display:flex;flex-wrap:wrap;gap:12px}.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.spell{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;color:#F2C94C;margin-top:-6px}.spell span{color:#C9C2EE}
.in,.mini{font:inherit;font-size:16px;color:#F6EBCB;background:rgba(255,255,255,.09);border:1px solid rgba(242,201,76,.45);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.mini{width:112px;min-height:38px;font-size:15px;padding:6px 10px}
.in::placeholder,.mini::placeholder{color:rgba(246,235,203,.5)}
.in:focus,.mini:focus{outline:2px solid #F2C94C;outline-offset:2px}
select.in option{background:#1A1646;color:#F6EBCB}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;letter-spacing:.02em;color:#C9C2EE;flex:1 1 140px;min-width:0}
.btn{font:inherit;font-size:15px;font-weight:700;color:#F6EBCB;background:linear-gradient(#FFE08A,#E0AE2E);border:0;border-radius:999px;min-height:46px;padding:0 22px;cursor:pointer;box-shadow:0 4px 18px rgba(242,201,76,.35)}
.btn::before{content:"\2726  "}
.btn:hover{filter:brightness(1.08);box-shadow:0 6px 26px rgba(242,201,76,.6)}
.rm{font:inherit;font-size:13px;color:#F6EBCB;background:rgba(255,255,255,.08);border:1px solid rgba(242,201,76,.5);border-radius:999px;min-height:36px;padding:0 14px;cursor:pointer;position:relative;display:inline-flex;align-items:center}
.rm:hover{background:rgba(242,201,76,.2)}
.rm:focus-within,.btn:focus-visible,.rm:focus-visible,.quote:focus-visible{outline:2px solid #F2C94C;outline-offset:3px}
.card{background:rgba(20,16,62,.56);-webkit-backdrop-filter:blur(5px) saturate(1.2);backdrop-filter:blur(5px) saturate(1.2);border:1px solid rgba(242,201,76,.38);border-radius:20px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.stat{flex:1 1 170px}.stat small{font-size:13px;color:#C9C2EE}.stat b{display:block;font-family:Cinzel,Georgia,serif;font-size:25px;margin-top:6px}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px}
.item{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(242,201,76,.2)}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.chk{width:22px;height:22px;accent-color:#F2C94C;margin:0}
.file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cols{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}.cols>div{flex:1 1 420px}
.quote{display:block;width:100%;text-align:center;cursor:pointer;color:inherit;font:inherit;padding:20px 16px;border:0;border-top:1px solid rgba(242,201,76,.4);border-bottom:1px solid rgba(242,201,76,.4);background:linear-gradient(90deg,rgba(242,201,76,0),rgba(242,201,76,.13),rgba(242,201,76,0))}
.qt{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(21px,3.2vw,30px);line-height:1.3;color:#FFE9A8}
.qt::before{content:"\2726  ";color:#F2C94C}.qt::after{content:"  \2726";color:#F2C94C}
.qa{display:block;margin-top:8px;font-size:12px;letter-spacing:.08em;color:#C9C2EE}
.ic{flex:none}
.pop{position:fixed;bottom:10px;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:popup 3.4s forwards}
.pop.R{right:max(12px,3vw)}.pop.L{left:max(12px,3vw)}
.pop svg{width:150px;height:auto}
.pop.bad svg{filter:drop-shadow(0 0 14px rgba(150,80,255,.75))}
.pop.good svg{filter:drop-shadow(0 0 16px rgba(255,215,106,.9))}
.bub{position:relative;width:max-content;max-width:210px;margin:0 auto 10px;padding:8px 12px;border-radius:14px;font-size:14px;font-weight:700;text-align:center;line-height:1.25}
.pop.bad .bub{background:#2A1A55;color:#E6DAFF;border:1px solid #8A6CFF}
.pop.good .bub{background:#FFF1C0;color:#3B2A10;border:1px solid #D4AF37}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:inherit;border:inherit;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.fw{transform-box:fill-box;transform-origin:center;animation:flapw .35s ease-in-out infinite alternate}
@keyframes flapw{from{transform:scaleY(1)}to{transform:scaleY(.7)}}
@keyframes popup{0%{transform:translateY(130%) scale(.7) rotate(-8deg);opacity:0}12%{transform:translateY(-6%) scale(1.06) rotate(4deg);opacity:1}20%{transform:translateY(0) scale(1) rotate(-2deg)}30%,78%{transform:translateY(0) scale(1) rotate(0)}100%{transform:translateY(130%) scale(.8) rotate(6deg);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,3%) scale(1.08)}}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}15%{opacity:1}55%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes turn{0%,40%{transform:scaleX(1)}60%,100%{transform:scaleX(-1)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--sx),-110vh);opacity:0}}
@keyframes mist{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
@keyframes swish{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes flapL{from{transform:rotate(-22deg)}to{transform:rotate(14deg)}}
@keyframes flapR{from{transform:rotate(22deg)}to{transform:rotate(-14deg)}}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(1300px)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(22deg)}3%{opacity:1}12%{opacity:0;transform:translate(130vw,55vh) rotate(22deg)}100%{opacity:0}}
@media(max-width:700px){.owl-snow{width:150px}.char{height:84px}.hero p{padding:0 64px;font-size:16px}.castle{height:180px}.hero{height:300px}.cat{width:60px}.moon{width:64px;height:64px}h2{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
const KEY='money-plan-v2',BASE_E=['Food','Rent and bills','Transport','Shopping','Health','Fun'],BASE_I=['Papa','Friend','Dividend','Refund','Gift'];
const ld=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const S={salary:'',other:'',month:ld().slice(0,7),expenses:[],goals:[],budgets:{},eDesc:'',eAmt:'',eCat:'Food',eDate:ld(),eRec:false,gName:'',gType:'Short-term',gPri:'Medium',gTarget:'',gSaved:'',gDate:'',gRate:'',pend:null,msg:'',cur:'INR',incomes:[],customExp:[],customInc:[],eCustom:'',iCat:'Papa',iCustom:'',iDesc:'',iAmt:'',iDate:ld(),iRec:false};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)Object.assign(S,{salary:d.salary||'',other:d.other||'',expenses:d.expenses||[],goals:d.goals||[],budgets:d.budgets||{},cur:d.cur||'INR',incomes:d.incomes||[],customExp:d.customExp||[],customInc:d.customInc||[]})}catch(e){}

72px\"><path d=\"M104 72C100 56 102 40 106 28L128 28C132 44 132 60 128 74z\" fill=\"url(#ia)\" stroke=\"#C4CDE6\" stroke-width=\".8\"/><path d=\"M112 34L112 66M120 32L120 68M127 38L125 70\" stroke=\"#C4CDE6\" stroke-width=\"1\" fill=\"none\"/><g class=\"wnt\" style=\"transform-origin:117px 30px\"><path d=\"M106 30C100 14 102 0 108 -10C112 2 116 6 120 -2C124 10 130 14 134 8C134 20 130 26 128 30z\" fill=\"url(#ia)\" stroke=\"#C4CDE6\" stroke-width=\".8\"/><path d=\"M110 24L110 2M118 26L118 4M126 26L128 10\" stroke=\"#C4CDE6\" stroke-width=\"1\" fill=\"none\"/></g></g></g><circle cx=\"170\" cy=\"76\" r=\"27\" fill=\"url(#ia)\" stroke=\"#C4CDE6\" stroke-width=\".8\"/><path d=\"M150 66Q164 54 186 62\" stroke=\"#B9C4E4\" stroke-width=\"2\" fill=\"none\"/><circle cx=\"180\" cy=\"73\" r=\"8\" fill=\"#FFC62E\"/><circle cx=\"181\" cy=\"73\" r=\"3.8\" fill=\"#1B1230\"/><circle cx=\"182.4\" cy=\"71.6\" r=\"1.2\" fill=\"#fff\"/><path d=\"M194 80L207 87L196 93z\" fill=\"#2B2B3B\"/><path d=\"M128 114q-1 9 7 9M138 114q1 9 9 8\" stroke=\"#2B2B3B\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></svg>"};
const expCats=()=>[...BASE_E,...S.customExp,'Other'],incCats=()=>[...BASE_I,...S.customInc,'Other'];
function resolveCat(kind){
  const cat=S[kind+'Cat'],custom=S[kind+'Custom'].trim().slice(0,30);
  if(cat!=='Other'||!custom||custom.toLowerCase()==='other')return cat;
  const list=kind==='e'?S.customExp:S.customInc,all=kind==='e'?expCats():incCats();
  const found=all.find(c=>c.toLowerCase()===custom.toLowerCase());
  if(found)return found;
  list.push(custom);return custom;
}

function calc(){
  const rv=S.incomes.filter(e=>e.date.slice(0,7)===S.month||(e.rec&&e.date.slice(0,7)<=S.month)).sort((a,b)=>b.date.localeCompare(a.date));
  const recvTotal=rv.reduce((a,e)=>a+e.amt,0);
  const inc=(parseFloat(S.salary)||0)+(parseFloat(S.other)||0)+recvTotal;
  const ex=S.expenses.filter(e=>e.date.slice(0,7)===S.month||(e.rec&&e.date.slice(0,7)<=S.month)).sort((a,b)=>b.date.localeCompare(a.date));
  const spent=ex.reduce((a,e)=>a+e.amt,0);
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth();
  const months=g=>g.date?Math.max(1,(+g.date.slice(0,4)-cy)*12+(+g.date.slice(5,7)-1-cm)):(g.months||1);
  const pay=(g,n)=>{const sv=parseFloat(g.saved)||0,T=g.target,r=(parseFloat(g.rate)||0)/1200;
    if(sv>=T)return 0;if(!r)return(T-sv)/n;const k=Math.pow(1+r,n),need=T-sv*k;return need<=0?0:need*r/(k-1)};
  const goals=S.goals.map(g=>{const n=months(g);return{...g,n,per:pay(g,n)}}).sort((a,b)=>(ORD[a.pri]??1)-(ORD[b.pri]??1)||b.per-a.per);
  const need=goals.reduce((a,g)=>a+g.per,0);
  return{inc,ex,spent,goals,need,left:inc-spent-need,rv,recvTotal};
}

function view(){
  const{inc,ex,spent,goals,need,left,rv,recvTotal}=calc();
  const sum=t=>goals.filter(g=>g.type===t).reduce((a,g)=>a+g.per,0);
  const basis=Math.max(inc,spent+need,1),pc=x=>Math.max(0,x)/basis*100;
  const pi=x=>inc>0?Math.round(Math.max(0,x)/inc*100)+'% of income':f(Math.max(0,x));
  let verdict='Vocate noctuam! Tell the owl your income, and it will show how your quests fit.',tip='';
  if(inc>0){verdict=left>=0?'Summa lucet! The stars align: '+f(left)+' stays in your pouch after spending and quest savings.':'Cautela! Your plan overshoots by '+f(-left)+' a month.';
    if(left<0){const c=goals.filter(g=>g.per>0).sort((a,b)=>(ORD[b.pri]??1)-(ORD[a.pri]??1)||b.per-a.per)[0];
      tip=c?'Give the quest "'+c.name+'" ('+c.pri+' priority) more time first, or spend fewer coins.':'Spend fewer coins, or find more treasure.'}}
  const tot=expCats().map(n=>({n,v:ex.filter(e=>e.cat===n).reduce((a,e)=>a+e.amt,0)}));
  const mx=Math.max(1,...tot.map(t=>t.v));
  const opt=(list,sel)=>list.map(o=>`<option value="${esc(o)}"${o===sel?' selected':''}>${esc(o==='Other'?'Other (invent your own)':o)}</option>`).join('');
  const inp=(k,type,val,extra='')=>`<input class="in" data-k="${k}" type="${type}" value="${esc(val)}" ${extra}>`;
  return `
<div class="card row" style="align-items:flex-end;gap:20px">
 <div class="muted" style="flex:1 1 200px;font-size:15px">Tell the ledger what you earn, and which month to chart.</div>
 <div class="row" style="flex:1 1 640px">
  <label class="lab">Monthly wages (${sym()})${inp('salary','number',S.salary,'min="0" inputmode="numeric" placeholder="e.g. 60000"')}</label>
  <label class="lab">Other treasure (${sym()})${inp('other','number',S.other,'min="0" inputmode="numeric" placeholder="e.g. 5000"')}</label>
  <label class="lab" style="flex-basis:170px">Month to chart${inp('month','month',S.month)}</label>
  <label class="lab" style="flex-basis:220px">Coin of the realm<select class="in" data-k="cur">${CURS.map(c=>`<option value="${c[0]}"${c[0]===S.cur?' selected':''}>${c[0]} - ${c[1]}</option>`).join('')}</select></label>
 </div>

const app=document.getElementById('app');
function render(){
  const a=document.activeElement,k=a&&a.dataset&&a.dataset.k,keep=k&&app.contains(a)?a:null;
  let st=null,en=null;
  if(keep){try{st=keep.selectionStart;en=keep.selectionEnd}catch(e){}}
  app.innerHTML=view();
  if(keep){
    const n=[...app.querySelectorAll('[data-k]')].find(x=>x.dataset.k===k);
    if(n){
      n.replaceWith(keep);keep.focus();
      try{
        if(keep.type==='number'){const t=keep.value.length;keep.type='text';keep.setSelectionRange(t,t);keep.type='number'}
        else if(st!=null)keep.setSelectionRange(st,en);
      }catch(e){}
    }
  }
}

function parseCsv(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}
function buildBackup(text){
  const rows=parseCsv(text.charCodeAt(0)===0xFEFF?text.slice(1):text);
  const out={expenses:[],goals:[],budgets:{},salary:undefined,other:undefined,cur:undefined,incomes:null,cx:[],ci:[]};let sec='',seen=false,recvNew=false;
  const clean=(c,base,list)=>{c=(c||'').trim().slice(0,30);if(!c)return'Other';if(c!=='Other'&&!base.includes(c)&&!list.includes(c))list.push(c);return c};
  rows.forEach(r=>{
    if(r.every(x=>x===''))return;const h=r[0];
    if(r.slice(1).every(x=>x==='')&&(h==='Expenses'||h==='Goals'||h==='Settings'||h==='Received')){sec=h;seen=true;if(h==='Received')out.incomes=[];return}
    if(h==='Date'){if(sec==='Received')recvNew=r.includes('Category');return}
    if(h==='Goal')return;
    if(sec==='Expenses'){const amt=parseFloat(r[3]);
      if(/^\d{4}-\d{2}-\d{2}$/.test(r[0])&&amt>0)out.expenses.push({id:uid(),date:r[0],desc:r[1]||r[2],cat:clean(r[2],BASE_E,out.cx),amt,rec:r[4]==='yes'})}
    else if(sec==='Received'){const o=recvNew?1:0,amt=parseFloat(r[2+o]);
      if(/^\d{4}-\d{2}-\d{2}$/.test(r[0])&&amt>0)out.incomes.push({id:uid(),date:r[0],desc:r[1]||'Money received',cat:recvNew?clean(r[2],BASE_I,out.ci):'Other',amt,rec:r[3+o]==='yes'})}
    else if(sec==='Goals'){const target=parseFloat(r[3]);
      if(target>0&&/^\d{4}-\d{2}$/.test(r[5]))out.goals.push({id:uid(),name:r[0]||'Untitled goal',type:r[1]==='Long-term'?'Long-term':'Short-term',pri:['High','Medium','Low'].includes(r[2])?r[2]:'Medium',target,saved:r[4]||'',date:r[5],rate:r[6]&&r[6]!=='0'?r[6]:''})}
    else if(sec==='Settings'){
      if(h==='Salary')out.salary=r[1]||'';else if(h==='Other income')out.other=r[1]||'';
      else if(h==='Currency'&&CURS.some(c=>c[0]===r[1]))out.cur=r[1];else if(h==='Budget'&&r[1])out.budgets[r[1]]=r[2]||'';else if(h==='Custom expense category'&&r[1]&&!out.cx.includes(r[1]))out.cx.push(r[1]);else if(h==='Custom income category'&&r[1]&&!out.ci.includes(r[1]))out.ci.push(r[1])}
  });
  return seen?out:null;
}
function exportCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const{goals}=calc();
  const rows=[['Expenses'],['Date','Description','Category','Amount','Repeats monthly']];
  S.expenses.forEach(e=>rows.push([e.date,e.desc,e.cat,e.amt,e.rec?'yes':'no']));
  rows.push([],['Received'],['Date','From','Category','Amount','Repeats monthly']);
  S.incomes.forEach(e=>rows.push([e.date,e.desc,e.cat||'Other',e.amt,e.rec?'yes':'no']));
  rows.push([],['Goals'],['Goal','Type','Priority','Target','Saved so far','Reach by','Return % per year','Save per month']);
  goals.forEach(g=>rows.push([g.name,g.type,g.pri,g.target,parseFloat(g.saved)||0,g.date||'',parseFloat(g.rate)||0,Math.round(g.per)]));
  rows.push([],['Settings'],['Salary',S.salary],['Other income',S.other],['Currency',S.cur]);
  expCats().forEach(n=>rows.push(['Budget',n,S.budgets[n]||'']));
  S.customExp.forEach(n=>rows.push(['Custom expense category',n]));
  S.customInc.forEach(n=>rows.push(['Custom income category',n]));
  const csv=rows.map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='money-plan-'+ld()+'.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

const BAD_MSG=['Mine now!','Ooh, shiny coins!','Thanks for the donation!','Your coins fly away!','Another coin gone\u2026'],GOOD_MSG=['Treasure incoming!','Well done, wizard!','Your pouch grows!','A fine day for coins!','The quest draws closer!'];
const lastPop={bad:-1,good:-1};let popT=null,savedBase=null,savedId=null;
function celebrate(kind,amt){
  const arts=kind==='bad'?BAD_ART:GOOD_ART,msgs=kind==='bad'?BAD_MSG:GOOD_MSG;
  let i;do{i=Math.floor(Math.random()*arts.length)}while(arts.length>1&&i===lastPop[kind]);lastPop[kind]=i;
  const m=msgs[Math.floor(Math.random()*msgs.length)]+(amt>0?' ('+(kind==='bad'?'\u2212':'+')+f(amt)+')':'');
  document.querySelectorAll('.pop').forEach(n=>n.remove());
  const el=document.createElement('div');el.className='pop '+kind+(Math.random()<.5?' L':' R');
  el.setAttribute('aria-hidden','true');el.innerHTML='<div class="bub">'+esc(m)+'</div>'+arts[i];
  document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
}
app.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k;if(!k)return;
  const v=el.type==='checkbox'?el.checked:el.value;
  if(k.startsWith('b:'))S.budgets[k.slice(2)]=v;
  else if(k.startsWith('gs:')){const g=S.goals.find(x=>String(x.id)===k.slice(3));
    if(g){const old=parseFloat(g.saved)||0;g.saved=v;
      if(savedId!==g.id){savedId=g.id;savedBase=old}
      clearTimeout(popT);popT=setTimeout(()=>{const d=(parseFloat(g.saved)||0)-savedBase;savedBase=null;savedId=null;if(d>0)celebrate('good',d)},900)}}
  else if(k==='month'){if(v)S.month=v}
  else S[k]=v;
  save();render();
});
app.addEventListener('change',e=>{
  const el=e.target;if(el.dataset.a!=='import')return;
  const file=el.files&&el.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{const d=buildBackup(String(rd.result));
    S.pend=d;S.msg=d?'':'This scroll does not come from this ledger.';render()};
  rd.onerror=()=>{S.msg='The scroll could not be read.';render()};
  rd.readAsText(file);
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='addE'){const amt=parseFloat(S.eAmt);if(!(amt>0)||!S.eDate)return;
    const cat=resolveCat('e');S.expenses.push({id:uid(),desc:S.eDesc.trim()||cat,amt,cat,date:S.eDate,rec:S.eRec});
    S.month=S.eDate.slice(0,7);S.eDesc='';S.eAmt='';S.eRec=false;S.eCat=cat;S.eCustom='';S.msg='';celebrate('bad',amt)}
  else if(a==='addG'){const target=parseFloat(S.gTarget);if(!(target>0)||!S.gDate)return;
    S.goals.push({id:uid(),name:S.gName.trim()||'Untitled goal',type:S.gType,pri:S.gPri,target,saved:S.gSaved,date:S.gDate,rate:S.gRate});
    const sv=parseFloat(S.gSaved)||0;S.gName='';S.gTarget='';S.gSaved='';S.gDate='';S.gRate='';S.msg='';if(sv>0)celebrate('good',sv)}
  else if(a==='addI'){const amt=parseFloat(S.iAmt);if(!(amt>0)||!S.iDate)return;
    const cat=resolveCat('i');S.incomes.push({id:uid(),desc:S.iDesc.trim()||cat,cat,amt,date:S.iDate,rec:S.iRec});
    S.month=S.iDate.slice(0,7);S.iDesc='';S.iAmt='';S.iRec=false;S.iCat=cat;S.iCustom='';S.msg='';celebrate('good',amt)}
  else if(a==='rmI')S.incomes=S.incomes.filter(x=>String(x.id)!==id);
  else if(a==='rmE')S.expenses=S.expenses.filter(x=>String(x.id)!==id);
  else if(a==='rmG')S.goals=S.goals.filter(x=>String(x.id)!==id);
  else if(a==='export'){exportCsv();return}
  else if(a==='applyImp'){const d=S.pend;if(!d)return;
    S.expenses=d.expenses;if(d.incomes)S.incomes=d.incomes;S.customExp=[...new Set([...S.customExp,...d.cx])];S.customInc=[...new Set([...S.customInc,...d.ci])];S.goals=d.goals;S.budgets=d.budgets;
    if(d.salary!==undefined)S.salary=d.salary;if(d.other!==undefined)S.other=d.other;if(d.cur)S.cur=d.cur;
    S.pend=null;S.msg='Restituo! Backup restored. The ledger is whole again.'}
  else if(a==='cancelImp')S.pend=null;
  else if(a==='quote'){const k=+b.dataset.i;let n=QI[k];do{n=(n+1)%QUOTES.length}while(QI.includes(n));QI[k]=n}
  else return;
  save();render();
});

(function(){const sky=document.getElementById('stars');let h='';
for(let i=0;i<70;i++){const z=1+Math.random()*2.5;h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*80}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*3}s"></i>`}
sky.innerHTML=h;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
for(let i=0;i<14;i++){const o=document.createElement('i');o.className='orb';const z=5+Math.random()*9;
o.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;--sx:${Math.round((Math.random()-.5)*160)}px;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`;document.body.appendChild(o)}
})();

(function(){
 const wrap=document.querySelector('.owl-wrap'),owl=document.querySelector('.owl-snow');
 if(!wrap||!owl||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const q=c=>owl.querySelector(c);
 const nr=q('.wn > g'),nt=q('.wnt'),fr=q('.wf > g > g'),ft=q('.wft');
 const DUR=24000,PAUSE=3500,K=Math.PI*3.2,AMP=46;
 let t0=performance.now(),last=t0,phase=0,lastDust=0;
 function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const W=wrap.clientWidth,e=(now-t0)%(DUR+PAUSE),c=e/DUR;
  if(c<=1){
   const x=-210+c*(W+420),y=100+Math.sin(c*K)*AMP+Math.sin(c*Math.PI*9)*6;
   const vy=Math.cos(c*K)*AMP*K,rise=Math.max(0,Math.min(1,-vy/(AMP*K)));
   const bank=Math.max(-12,Math.min(14,vy*0.045));
   const sc=(W<700?.8:1)*(0.95+0.14*Math.sin(c*Math.PI*2.4+1));
   owl.style.transform=`translate(${x}px,${y}px) rotate(${bank}deg) scale(${sc})`;
   const A=0.4+0.6*rise;phase+=dt/1000*6.283*(0.9+1.7*rise);
   const s=Math.sin(phase);
   if(nr)nr.style.transform=`rotate(${30+70*A*s}deg)`;
   if(nt)nt.style.transform=`rotate(${-35*A*Math.sin(phase-0.9)}deg)`;
   if(fr)fr.style.transform=`rotate(${24+60*A*Math.sin(phase+0.3)}deg)`;
   if(ft)ft.style.transform=`rotate(${-28*A*Math.sin(phase-0.6)}deg)`;
   if(now-lastDust>55){lastDust=now;const d=document.createElement('i');d.className='dust';
    d.style.cssText=`left:${x+30*sc+Math.random()*16}px;top:${y+78*sc+Math.random()*30}px;--dx:${-20-Math.random()*40}px;--dy:${(Math.random()-.3)*40}px`;
    wrap.appendChild(d);setTimeout(()=>d.remove(),1500)}
  }else owl.style.transform='translate(-400px,0)';
  requestAnimationFrame(frame)}
 requestAnimationFrame(frame);
})();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
